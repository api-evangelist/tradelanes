aid: tradelanes
name: TradeLanes
description: >-
  TradeLanes is a trade execution and operational-intelligence platform for
  U.S. exporters, freight forwarders, and drayage teams. Its Vessel Schedule
  Report (VSR) delivers a daily delta-only view of ERD and CY cutoff changes
  across 40+ U.S. container terminals, Ava adds decision intelligence that
  evaluates whether a schedule change affects a specific booking
  (safe-to-commit / safe-to-dispatch), and the eLane Trade Execution Suite
  manages shipments, documents, and tasks. A Techstars portfolio company
  headquartered in Walnut Creek, CA; no public developer API is documented.
